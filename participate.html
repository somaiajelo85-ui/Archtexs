<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نساء اليمن للمصالحة الوطنية - شارك معنا</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <a href="index.html" class="logo-container">
                <img src="images/logo.png" alt="شعار نساء اليمن للمصالحة الوطنية" class="site-logo">
                <div class="logo-text">نساء اليمن<br>للمصالحة الوطنية</div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="activities.html">الأنشطة</a></li>
                <li><a href="literature.html">إصدارات</a></li>
                <li><a href="participate.html">شارك معنا</a></li>
                <li><a href="contact.html">اتصل بنا</a></li>
            </ul>
        </div>
    </header>

    <main>
        
        <h2 class="section-title">شارك معنا في صنع السلام</h2>
        <p style="margin-bottom: 2rem;">نرحب بانضمام كل من يؤمن بأهمية دور المرأة في المصالحة الوطنية. يمكنك المساهمة كمتطوع أو تقديم أفكار ومقترحات.</p>
        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <form>
                <label for="name" style="font-weight: bold; color: var(--secondary-color);">الاسم الثلاثي:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email" style="font-weight: bold; color: var(--secondary-color);">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="interest" style="font-weight: bold; color: var(--secondary-color);">مجال الاهتمام:</label>
                <input type="text" id="interest" name="interest">
                
                <label for="message" style="font-weight: bold; color: var(--secondary-color);">كيف تود المساهمة؟</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                
                <button type="submit" style="margin-top: 1rem;">إرسال الطلب</button>
            </form>
        </div>
        
    </main>

    <footer>
        <p>&copy; 2026 نساء اليمن للمصالحة الوطنية. جميع الحقوق محفوظة.</p>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
